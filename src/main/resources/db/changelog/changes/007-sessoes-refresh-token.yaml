databaseChangeLog:
  - changeSet:
      id: 007-01-create-sessao-refresh-token
      author: curso-spring-2026
      comment: Persiste somente o hash do refresh token e mantém sua família para rotação e revogação.
      changes:
        - createTable:
            tableName: sessao_refresh_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sessao_refresh_token
                    nullable: false
              - column:
                  name: conta_acesso_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: familia_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_sessao_refresh_token_hash
              - column:
                  name: criada_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: ultima_atividade_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expira_em
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: utilizada_em
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revogada_em
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: motivo_revogacao
                  type: VARCHAR(30)
        - addForeignKeyConstraint:
            baseTableName: sessao_refresh_token
            baseColumnNames: conta_acesso_id
            referencedTableName: conta_acesso
            referencedColumnNames: id
            constraintName: fk_sessao_refresh_token_conta
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: sessao_refresh_token

  - changeSet:
      id: 007-02-index-sessao-refresh-token
      author: curso-spring-2026
      comment: Acelera revogação por família e encerramento global por conta.
      changes:
        - createIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_familia
            columns:
              - column:
                  name: familia_id
        - createIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_conta
            columns:
              - column:
                  name: conta_acesso_id
      rollback:
        - dropIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_conta
        - dropIndex:
            tableName: sessao_refresh_token
            indexName: idx_sessao_refresh_token_familia

  - changeSet:
      id: 007-03-checks-sessao-refresh-token
      author: curso-spring-2026
      comment: Restringe expiração e motivos de revogação no próprio banco.
      changes:
        - sql:
            sql: >
              ALTER TABLE sessao_refresh_token
              ADD CONSTRAINT ck_sessao_refresh_token_expiracao
              CHECK (expira_em > criada_em)
        - sql:
            sql: >
              ALTER TABLE sessao_refresh_token
              ADD CONSTRAINT ck_sessao_refresh_token_motivo
              CHECK (motivo_revogacao IS NULL OR motivo_revogacao IN
              ('LOGOUT', 'LOGOUT_GLOBAL', 'INATIVIDADE', 'EXPIRACAO_ABSOLUTA',
              'REUTILIZACAO', 'CONTA_INATIVA'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE sessao_refresh_token
              DROP CONSTRAINT ck_sessao_refresh_token_motivo
        - sql:
            sql: >
              ALTER TABLE sessao_refresh_token
              DROP CONSTRAINT ck_sessao_refresh_token_expiracao
