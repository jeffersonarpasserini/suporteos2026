spring.application.name=suporteos2026

# Exige a escolha consciente do ambiente: dev, test ou prod.
spring.profiles.default=none

# Liquibase cria/evolui o esquema; Hibernate apenas confere o mapeamento.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Evita respostas acidentalmente grandes nas consultas paginadas.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# JWT: a chave Base64 deve vir do ambiente e possuir pelo menos 256 bits.
app.security.jwt.issuer=https://suporteos2026.local
app.security.jwt.expiration=PT30M
app.security.jwt.secret=${JWT_SECRET}

# A sessão renovável vence por inatividade e também por um limite absoluto.
app.security.refresh-token.idle-timeout=${REFRESH_TOKEN_IDLE_TIMEOUT:PT30M}
app.security.refresh-token.absolute-expiration=${REFRESH_TOKEN_ABSOLUTE_EXPIRATION:PT8H}

# Provisionamento de uso único para um banco vazio. Permanece desligado por padrão.
app.security.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.security.initial-admin.nome=${INITIAL_ADMIN_NAME:}
app.security.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.security.initial-admin.cpf=${INITIAL_ADMIN_CPF:}
app.security.initial-admin.login=${INITIAL_ADMIN_LOGIN:}
app.security.initial-admin.senha=${INITIAL_ADMIN_PASSWORD:}
