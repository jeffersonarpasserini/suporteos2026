spring.application.name=suporteos2026

# Exige a escolha consciente do ambiente: dev, test ou prod.
spring.profiles.default=none

# Liquibase cria/evolui o esquema; Hibernate apenas confere o mapeamento.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Evita respostas acidentalmente grandes nas consultas paginadas.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
